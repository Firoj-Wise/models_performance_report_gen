      image_id: sha256:7d7229436b5452b9cfb89725d1e0353c5c57e1d26844ba53562829656c530686
      port: 51001
      model: IndicTrans2 (nep-eng-indictrans2-v3 & eng-nep-indictrans2-v1)
      runtime: PyTorch 2.13.0+cu130 (Transformers / Fairseq)
      precision: fp16
      gpu_allocation_mb: 1140

benchmark:
  warmup_requests: 2
  measured_requests_per_level: 8
  concurrency_levels:
    - 1
    - 2
    - 4
    - 8
