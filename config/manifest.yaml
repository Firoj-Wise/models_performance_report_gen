      image_id: sha256:51717a567838eebe69769d0230d160a9d4bfd2889f78d7f6150d68e0ae48660e
      port: 8092
      model: mlwiseyak/omnivoice-nepali-tts-v2
      served_model_name: omnivoice_nepali_tts
      runtime: vLLM Omni 0.28.0 (PyTorch 2.13.0+cu130)
      precision: fp16
      steps: 16
      batch_sizes: [1, 2, 3, 4]
      gpu_allocation_mb: 5640

  asr:
    gateway:
      container: wiseai-asr-api-dev
      image: registry.wiseai.wiseyak.com/wiseai-asr-api-dev:latest
      image_id: sha256:a5c2bc762575e565ea88a8e75a86d1af39af44b8e41c85c8d2dc4d659a9e5e4e
