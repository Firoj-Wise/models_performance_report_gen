server:
  id: mirage
  hostname: mirage
  environment: development_staging_shared

hardware:
  cpu:
    model: AMD Ryzen 9 7950X 16-Core Processor
    sockets: 1
    cores: 16
    threads: 32
    numa_nodes: 1
  ram:
    total_gb: 62.4
    swap_gb: 85.0
  storage:
    type: NVMe
    device: /dev/nvme0n1p2
    size_gb: 529
    available_gb: 296
  gpu:
    vendor: NVIDIA
    model: GeForce RTX 3090
    count: 1
    memory_mb: 24576
    architecture: Ampere GA102
    compute_capability: "8.6"
    pcie_generation: 4
    driver_version: "595.84"
    cuda_version: "13.2"
    ecc_supported: false
    mig_supported: false

docker:
  engine_version: "29.6.1"
  compose_version: "v5.3.0"
  container_runtime: runc
  nvidia_container_toolkit: active

services:
  tts:
    gateway:
